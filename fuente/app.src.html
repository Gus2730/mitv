const BACK_KEYS = new Set(['Escape','Backspace','GoBack','BrowserBack']);
const BACK_CODES = new Set([10009, 461, 27]);
function focusables(limit = true){
  const root = modals.length ? modals[modals.length - 1].el : player.classList.contains('open') ? player : document;
  const vh = innerHeight, out = [];
  for (const el of root.querySelectorAll('button, input, select, textarea, a[href], video')){
    if (el.disabled || el.hidden || el.tabIndex < 0) continue;
    if (el.tagName === 'VIDEO' && el.id !== 'video') continue; // los videos de Multivista no reciben el foco
    if (root === document && player.contains(el)) continue;
    const r = el.getBoundingClientRect();
    if (!r.width || !r.height) continue;
    if (limit && (r.bottom < -vh * 1.5 || r.top > vh * 2.5)) continue; // muy lejos de la pantalla: no hace falta medirlo
    el._r = r; out.push(el);
  }
  return out;
}
function moveFocus(dir, wide){
  const cur = document.activeElement;
  // Al entrar a una sección desde el menú, volver al último canal que tenías enfocado ahí
  if (!wide && IS_TV && cur && $('header').contains(cur) && !modals.length && !player.classList.contains('open') &&
      (document.documentElement.classList.contains('sidenav') ? dir === 'ArrowRight' : dir === 'ArrowDown') && restoreFocus()) return;
  let all = focusables(!wide);
  // Menú lateral (TV): ▲▼ se quedan en el menú; ▶ entra al contenido
  if (cur && document.documentElement.classList.contains('sidenav') && $('header').contains(cur)){
    const hdr = $('header');
    if (dir === 'ArrowUp' || dir === 'ArrowDown') all = all.filter(e => e === cur || hdr.contains(e));
    else if (dir === 'ArrowRight') all = all.filter(e => e === cur || !hdr.contains(e));
  } else if (cur && document.documentElement.classList.contains('sidenav') && dir !== 'ArrowLeft'){
    const hdr = $('header'); all = all.filter(e => !hdr.contains(e)); // al menú solo se entra con ◀
  }
  if (!cur || cur === document.body || !all.includes(cur)){ (all.find(e => e.matches('.card')) || all[0])?.focus(); return; }
  const a = cur.getBoundingClientRect(), ax = a.left + a.width/2, ay = a.top + a.height/2;
  // Distancia entre bordes (0 si dos controles se superponen en ese eje): así un campo ancho justo
  // arriba gana sobre un botón lejano que solo tiene el centro mejor alineado
  const gap = (lo1, hi1, lo2, hi2) => Math.max(0, Math.max(lo1, lo2) - Math.min(hi1, hi2));
  const cands = [];
  for (const el of all){
    if (el === cur) continue;
    const b = el._r, dx = b.left + b.width/2 - ax, dy = b.top + b.height/2 - ay;
    let main, side, cen;
    if (dir === 'ArrowRight'){ if (b.left < a.right - 4 && !(dx > 0 && b.left > a.left + 4)) continue; main = Math.max(0, b.left - a.right); side = gap(a.top, a.bottom, b.top, b.bottom); cen = Math.abs(dy); }
    else if (dir === 'ArrowLeft'){ if (b.right > a.left + 4 && !(dx < 0 && b.right < a.right - 4)) continue; main = Math.max(0, a.left - b.right); side = gap(a.top, a.bottom, b.top, b.bottom); cen = Math.abs(dy); }
    else if (dir === 'ArrowDown'){ if (b.top < a.bottom - 4 && !(dy > 0 && b.top > a.top + 4)) continue; main = Math.max(0, b.top - a.bottom); side = gap(a.left, a.right, b.left, b.right); cen = Math.abs(dx); }
    else { if (b.bottom > a.top + 4 && !(dy < 0 && b.bottom < a.bottom - 4)) continue; main = Math.max(0, a.top - b.bottom); side = gap(a.left, a.right, b.left, b.right); cen = Math.abs(dx); }
    cands.push([main + side * 2 + cen * 0.05, el]);
  }
  cands.sort((x, y) => x[0] - y[0]);
  // El más cercano que de verdad acepte el foco
  for (const [, el] of cands){
    el.focus({ preventScroll: true });
    if (document.activeElement === el){ el.scrollIntoView({ block: 'nearest', inline: 'nearest' }); return; }
  }
  if (!wide) moveFocus(dir, true); // el siguiente control está lejos: buscarlo en toda la página
}
let lastMove = 0;
// Listas desplegables en TV: OK abre una lista grande para elegir con el control
function openSelectPicker(sel){
  const label = (sel.closest('.field') && sel.closest('.field').querySelector('label')) ? sel.closest('.field').querySelector('label').textContent : 'Elegir una opción';
  const md = openModal(`<h3>${esc(label)}</h3>` + [...sel.options].map((o, i) => `<button class="btn ${o.selected ? '' : 'ghost'} pickopt" data-o="${i}" ${o.selected ? 'autofocus' : ''}>${o.selected ? '✓ ' : ''}${esc(o.text)}</button>`).join(''));
  md.onclick = e => {
    const b = e.target.closest('[data-o]'); if (!b) return;
    sel.selectedIndex = +b.dataset.o;
    closeModal();
    sel.dispatchEvent(new Event('change', { bubbles: true }));
    sel.focus();
  };
}
// ¿El cursor de texto está en el borde? (para poder salir del campo con ◀ ▶)
function atTextEdge(el, dir){
  let st = null, en = null;
  try { st = el.selectionStart; en = el.selectionEnd; } catch(e){}
  if (st === null || st === undefined) return true; // campos sin cursor (número, correo…)
  const len = (el.value || '').length;
  return dir === 'ArrowLeft' ? (st === 0 && en === 0) : (st === len && en === len);
}
function seekBy(sec){
  const s = video.seekable, b = video.buffered;
  let min = 0, max = video.duration;
  if (!isFinite(max)){ max = Math.max(s.length ? s.end(s.length - 1) : 0, b.length ? b.end(b.length - 1) : 0); min = Math.min(s.length ? s.start(0) : Infinity, b.length ? b.start(0) : Infinity); if (!isFinite(min)) min = 0; }
  video.currentTime = Math.min(Math.max(min, video.currentTime + sec), Math.max(min, max - 1));
  toast((sec > 0 ? '⏩ +' : '⏪ ') + sec + ' s');
}
function handleBack(){
  if ($('#dim').style.display === 'block'){ $('#dim').style.display = 'none'; return true; }
  if (modals.length) return closeModal();
  if (chListOpen()){ closeChannelList(); return true; }
  if (pMenu.classList.contains('show')){ pMenu.classList.remove('show'); return true; }
  if (player.classList.contains('open')){ closePlayer(); return true; }
  if (document.fullscreenElement){ document.exitFullscreen().catch(() => {}); return true; }
  return backToHome();
}
window.mitvBack = handleBack; // usado por el botón Atrás de la app Android

document.addEventListener('keydown', e => {
  const typing = !!(e.target.matches && e.target.matches('input:not([type=checkbox]):not([type=button]):not([type=submit]), textarea, select'));
  const open = player.classList.contains('open');
  if ((BACK_KEYS.has(e.key) || BACK_CODES.has(e.keyCode)) && !(typing && e.key === 'Backspace')){
    if (handleBack()) e.preventDefault();
    return;
  }
  if (!typing && !modals.length && /^[0-9]$/.test(e.key)){ e.preventDefault(); zapDigit(e.key); return; }
  // Botones multimedia del control
  if (open && (e.key === 'MediaPlayPause' || e.key === 'MediaPlay' || e.key === 'MediaPause' || e.keyCode === 179)){ e.preventDefault(); if (video.paused) video.play().catch(() => {}); else video.pause(); poke(); return; }
  if (open && (e.key === 'MediaFastForward' || e.keyCode === 228)){ e.preventDefault(); seekBy(30); return; }
  if (open && (e.key === 'MediaRewind' || e.keyCode === 227)){ e.preventDefault(); seekBy(-30); return; }
  if (open && (e.key === 'MediaTrackNext' || e.key === 'MediaTrackPrevious')){ e.preventDefault(); step(e.key === 'MediaTrackNext' ? 1 : -1); return; }
  // En TV, con el video en pantalla: ▲▼ cambian de canal, ◀▶ adelantan o atrasan y OK muestra los botones
  if (IS_TV && open && !modals.length && !pMenu.classList.contains('show') && (document.activeElement === video || document.activeElement === document.body)){
    const it = S.current && S.current.items[S.current.index];
    if (e.key === 'Enter'){ e.preventDefault(); poke(); if (it && !isVod(it) && S.current.items.length > 1) openChannelList(); else $('#pClose').focus(); return; }
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && it && it.kind !== 'youtube'){ e.preventDefault(); seekBy(e.key === 'ArrowLeft' ? -10 : 10); return; }
    if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && it && !isVod(it)){ e.preventDefault(); if (!e.repeat) step(e.key === 'ArrowUp' ? -1 : 1); return; }
  }
  if (!typing && !modals.length && (e.key === 'l' || e.key === 'L' || e.key === 'Recall')){ e.preventDefault(); prevChannel(); return; }
  if ($('#dim').style.display === 'block'){ $('#dim').style.display = 'none'; e.preventDefault(); return; }
  if (open && !modals.length && (e.key === 'ChannelUp' || e.key === 'PageUp')){ e.preventDefault(); step(-1); return; }
  if (open && !modals.length && (e.key === 'ChannelDown' || e.key === 'PageDown')){ e.preventDefault(); step(1); return; }
  if (open && !modals.length && document.activeElement === video && (e.key === 'ArrowUp' || e.key === 'ArrowDown') && !isVod(S.current.items[S.current.index])){
    e.preventDefault(); step(e.key === 'ArrowUp' ? -1 : 1); return;
  }
  // OK del control sobre una casilla: activarla o desactivarla
  if (e.key === 'Enter' && e.target.matches && e.target.matches('input[type=checkbox], input[type=radio]')){ e.preventDefault(); e.target.click(); return; }
  // OK sobre una lista desplegable en TV: abrir la lista grande
  if (e.key === 'Enter' && LITE && e.target.tagName === 'SELECT'){ e.preventDefault(); openSelectPicker(e.target); return; }
  if (e.key.startsWith('Arrow')){
    // Si se mantiene presionada la flecha, no acumular movimientos
    if (e.repeat && Date.now() - lastMove < (IS_TV ? 110 : 45)){ e.preventDefault(); return; }
    lastMove = Date.now();
    const tag = e.target.tagName, side = e.key === 'ArrowLeft' || e.key === 'ArrowRight';
    if (tag === 'SELECT' && !LITE) return;                      // computadora: las flechas cambian la opción
    if (tag === 'TEXTAREA' && !(side && atTextEdge(e.target, e.key))) return;
    if (tag === 'INPUT' && typing && side && !atTextEdge(e.target, e.key)) return; // mover el cursor dentro del texto
    if (open && document.activeElement === video && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;
    e.preventDefault(); moveFocus(e.key);
  }
});
