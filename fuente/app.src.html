<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0f17">
<title>MiTV</title>
<style>
:root{
  --bg:#0b0f17; --panel:#121826; --panel2:#182033; --line:#243049;
  --text:#e8edf6; --muted:#8d99b0; --accent:#2fd18b; --accent2:#1fa36b; --onaccent:#04120b;
  --warn:#ffb547; --err:#ff6b6b; --thumb1:#1a2338; --thumb2:#0f1525; --ini:#4b5a7a;
  --radius:12px; --cardmin:168px;
}
[data-theme=medianoche]{--bg:#070b1e;--panel:#0e1430;--panel2:#16204a;--line:#25315f;--accent:#6c8cff;--accent2:#5072f0;--onaccent:#fff;--thumb1:#18224d;--thumb2:#0c1230;--ini:#4d5c9a}
[data-theme=tica]{--bg:#0a0f24;--panel:#111a3a;--panel2:#1a2654;--line:#2a3870;--accent:#e63946;--accent2:#c92f3b;--onaccent:#fff;--thumb1:#1b2860;--thumb2:#0e1638;--ini:#5463a8}
[data-theme=claro]{--bg:#f3f5f9;--panel:#ffffff;--panel2:#e7ebf3;--line:#d4dae6;--text:#141a26;--muted:#5b6578;--accent:#0f9d63;--accent2:#0b7f50;--onaccent:#fff;--thumb1:#eef1f6;--thumb2:#dfe4ee;--ini:#9aa5ba}
html.big{--cardmin:220px}
html.big body{font-size:18px}
html.big .card .name{font-size:17px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus{outline:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--bg);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;white-space:nowrap}
.logo span{color:var(--accent)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:600}
nav button.active{background:var(--panel2);color:var(--text)}
nav button:hover{color:var(--text)}
.search{margin-left:auto;flex:0 1 260px}
.search input{width:100%;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.avatar{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);font-weight:800;color:#fff;flex:none}

main{display:flex;min-height:calc(100% - 62px)}
aside{width:220px;flex:none;border-right:1px solid var(--line);padding:14px 10px;overflow:auto;max-height:calc(100vh - 62px);position:sticky;top:62px}
aside h4{margin:14px 10px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
aside button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;color:var(--text)}
aside button:hover{background:var(--panel)}
aside button.active{background:var(--panel2);color:var(--accent);font-weight:600}
aside .flag{font-size:18px;width:22px;text-align:center}
.content{flex:1;padding:18px 22px 60px;min-width:0}
.content h2{margin:4px 0 4px;font-size:22px}
.sub{color:var(--muted);margin:0 0 14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;align-items:center}
.chip{background:var(--panel);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:13px;color:var(--muted)}
.chip.active{border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cardmin),1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:0;overflow:hidden;text-align:left;transition:transform .12s,border-color .12s}
.card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--accent)}
.thumb{position:relative;height:92px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--thumb1),var(--thumb2));padding:12px;overflow:hidden}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.thumb .ini{font-size:28px;font-weight:800;color:var(--ini)}
.thumb video.prev{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.posters .thumb{height:auto;aspect-ratio:2/3;padding:0}
.posters .thumb img{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover}
.card .meta{padding:9px 11px 11px}
.card .name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .grp,.card .now{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .now{color:var(--accent)}
.card .badges{position:absolute;top:6px;right:8px;display:flex;gap:4px;font-size:14px;text-shadow:0 1px 3px #000;z-index:2}
.card .num{position:absolute;top:6px;left:8px;font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);border-radius:6px;padding:1px 6px;opacity:.85;z-index:2}
.card .dot{position:absolute;bottom:8px;right:8px;width:9px;height:9px;border-radius:50%;z-index:2}
.dot.ok{background:#2fd18b;box-shadow:0 0 6px #2fd18b}
.dot.down{background:#6b7486}
.dot.warn{background:#ffb547}
.card .pbar2{height:4px;background:var(--line)}
.card .pbar2 i{display:block;height:100%;background:var(--accent)}
.empty,.loading,.notice{background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);padding:22px;color:var(--muted)}
.notice{border-style:solid;margin-bottom:16px}
.notice b{color:var(--text)}
.btn{background:var(--accent);color:var(--onaccent);border:0;padding:9px 16px;border-radius:10px;font-weight:700}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--err);border:1px solid var(--err)}
.btn.small{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;flex:1;min-width:200px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,textarea{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.box h3{margin:0 0 10px;font-size:16px}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
.list-item .grow{flex:1;min-width:0}
.list-item small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.section-title{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.section-title h3{margin:0;font-size:16px}
.muted{color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;gap:6px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.switch{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--accent)}

/* Guide */
.guide-row{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:stretch;padding:8px 0;border-top:1px solid var(--line)}
.guide-ch{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left;min-width:0}
.guide-ch img{width:40px;height:28px;object-fit:contain}
.guide-ch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:13px}
.guide-progs{display:flex;gap:6px;overflow:hidden}
.prog{flex:1 1 0;min-width:120px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;overflow:hidden}
.prog.now{border-color:var(--accent)}
.prog b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog small{color:var(--muted)}
.prog .bar{height:3px;background:var(--line);margin-top:6px;border-radius:2px}
.prog .bar i{display:block;height:100%;background:var(--accent);border-radius:2px}

/* Multiview */
.mv{display:grid;gap:6px;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9;max-height:calc(100vh - 200px)}
.mv.l2{grid-template-columns:1fr 1fr;aspect-ratio:32/9}
.mv.l4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.mv:fullscreen{max-height:none;border-radius:0;aspect-ratio:auto}
.slot{position:relative;background:#05070c;min-height:0;display:flex;align-items:center;justify-content:center;outline:3px solid transparent;outline-offset:-3px}
.slot.audio{outline-color:var(--accent)}
.slot video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.slot .lbl{position:absolute;left:8px;bottom:8px;display:flex;gap:6px;align-items:center;z-index:2}
.slot .lbl span{background:#000a;color:#fff;padding:4px 8px;border-radius:6px;font-size:12px}
.slot .sel{position:absolute;inset:0;background:none;border:0;z-index:1}
.slot .empty-slot{color:#8d99b0;z-index:2}

/* Player */
#player{position:fixed;inset:0;background:#000;z-index:50;display:none}
#player.open{display:block}
#player video{width:100%;height:100%;background:#000}
.pbar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:12px 16px;background:linear-gradient(#000d,#0000);transition:opacity .3s;flex-wrap:wrap;color:#fff}
.pbar .t{flex:1;min-width:160px}
.pbar .t b{display:block;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar .t small{color:#ccc;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar button{background:#ffffff1f;border:1px solid #ffffff33;color:#fff;padding:8px 11px;border-radius:10px;font-weight:600;white-space:nowrap}
.pbar button:hover{background:#ffffff33}
#player.idle .pbar{opacity:0}
.pmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:520px;width:calc(100% - 40px);text-align:center;background:#0b0f17ee;color:#e8edf6;border:1px solid #243049;border-radius:14px;padding:22px;display:none}
.pmsg.show{display:block}
.menu{position:absolute;right:16px;top:64px;background:#121826;border:1px solid #243049;border-radius:12px;padding:6px;display:none;min-width:200px;z-index:3}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:#e8edf6;padding:9px 12px;border-radius:8px}
.menu button:hover,.menu button:focus-visible{background:#182033}
.menu button.on{color:#2fd18b}
.spinner{width:42px;height:42px;border:4px solid #ffffff33;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
#zap{position:fixed;top:24px;right:30px;z-index:70;font-size:64px;font-weight:800;color:#fff;background:#000b;border-radius:16px;padding:6px 22px;display:none;font-variant-numeric:tabular-nums}
#zap small{display:block;font-size:14px;font-weight:600;color:#ccc;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:80;display:none;max-width:90vw}
.toast.show{display:block}

/* Modal */
.modal-bg{position:fixed;inset:0;background:#000a;z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto}
.modal h3{margin:0 0 12px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.pin{font-size:28px;letter-spacing:12px;text-align:center;width:180px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.detail{display:flex;gap:18px}
.detail img{width:160px;border-radius:10px;align-self:flex-start}
.prof{display:flex;flex-wrap:wrap;gap:14px}
.prof .p{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:6px;border-radius:12px;color:var(--text)}
.prof .p .avatar{width:64px;height:64px;font-size:24px}
.prof .p.on .avatar{border-color:var(--accent)}

/* Modo TV: sin animaciones pesadas, foco bien visible, el elemento enfocado nunca queda bajo el encabezado */
html{scroll-padding-top:84px;scroll-padding-bottom:24px}
html.tv *{transition:none !important}
html.tv header{gap:10px;padding:8px 14px;flex-wrap:nowrap}
html.tv nav{flex-wrap:nowrap}
html.tv nav button{padding:7px 8px;font-size:14px;white-space:nowrap}
html.tv .logo{font-size:19px}
html.tv .search{flex:0 1 150px}
html.tv .search input{padding:7px 12px}
html.tv main{min-height:calc(100vh - 54px)}
html.tv aside{top:54px;max-height:calc(100vh - 54px)}
html.tv .card:hover{transform:none}
html.tv .card:focus,html.tv .hero:focus,html.tv aside button:focus,html.tv nav button:focus,html.tv .chip:focus,html.tv .btn:focus,html.tv .prog:focus,html.tv .guide-ch:focus,html.tv .pbar button:focus,html.tv .menu button:focus,html.tv .iconbtn:focus,html.tv .avatar:focus{outline:4px solid var(--accent);outline-offset:2px}
html.tv .card:focus{border-color:var(--accent);background:var(--panel2)}
html.tv :focus{outline:4px solid var(--accent) !important;outline-offset:2px}
html.tv #video:focus,html.tv .modal:focus{outline:none !important}
html.tv label:focus-within{outline:4px solid var(--accent);outline-offset:2px;border-radius:10px}
html.tv input[type=checkbox]{width:22px;height:22px}
html.tv select{min-height:40px}
.pickopt{display:block;width:100%;margin:6px 0;text-align:left}
html.tv .dot.ok{box-shadow:none}
html.tv #video:focus{outline:none}
html.tv .spinner{animation-duration:1.4s}
/* MiTV 3.5 */
#netBar{display:none;padding:9px 18px;background:#5a3a00;color:#ffe2a8;font-size:14px}
#netBar.show{display:block}
#bgArt{position:fixed;inset:0;z-index:-1;background-size:40%;background-position:85% 15%;background-repeat:no-repeat;filter:blur(60px) saturate(1.4);opacity:0;transition:opacity .6s;pointer-events:none}
#bgArt.show{opacity:.22}
html.tv .hero{padding:22px 26px}
html.tv .hero b{font-size:26px}
html.tv .hero-img{width:170px;height:96px}
html.tv .grid.rowg{grid-auto-columns:200px}
.topline{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;justify-content:space-between}
.wx{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 14px}
.wx-ico{font-size:28px}
.wx b{font-size:24px}
.wx span{display:flex;flex-direction:column;font-size:13px}
.wx small{color:var(--muted)}
.traffic{position:relative;height:60vh;border-radius:12px;overflow:hidden;background:#000}
.traffic iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.modal.wide{width:min(1000px,100%)}
#osd{position:absolute;left:24px;bottom:96px;display:none;align-items:center;gap:14px;background:#0b0f17e6;color:#fff;border:1px solid #2fd18b55;border-radius:14px;padding:12px 18px;max-width:min(620px,80vw);z-index:3}
#osd.show{display:flex}
.osd-num{font-size:34px;font-weight:800;color:#2fd18b;min-width:44px;text-align:center}
.osd-logo img{width:64px;height:40px;object-fit:contain}
.osd-txt{display:flex;flex-direction:column;min-width:0}
.osd-txt b{font-size:19px}
.osd-txt span,.osd-txt small{color:#c9d1e0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chList{position:absolute;left:0;top:0;bottom:0;width:min(420px,90vw);background:#0b0f17f2;color:#e8edf6;z-index:4;display:none;flex-direction:column;border-right:1px solid #243049}
#chList.show{display:flex}
.chl-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #243049}
.chl-list{overflow:auto;flex:1;padding:6px}
.chl-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:#e8edf6;padding:8px 10px;border-radius:10px;text-align:left}
.chl-item.on{background:#182033}
.chl-item:focus{background:#2fd18b22}
.chl-n{font-weight:800;font-size:18px;color:#2fd18b;min-width:40px;text-align:right}
.chl-l{width:52px;height:32px;display:flex;align-items:center;justify-content:center}
.chl-l img{max-width:100%;max-height:100%}
.chl-t{display:flex;flex-direction:column;min-width:0}
.chl-t b,.chl-t small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chl-t small{color:#8d99b0}
#player.audioonly #video{visibility:hidden}
#saver{position:fixed;inset:0;z-index:300;background:#000;display:none;color:#e8edf6;cursor:none}
#saver.show{display:block}
.sv-box{position:absolute;text-align:left;transition:left 2s,top 2s}
.sv-time{font-size:96px;font-weight:200;letter-spacing:-2px;line-height:1}
.sv-date{font-size:22px;color:#8d99b0;text-transform:capitalize;margin-top:6px}
.sv-wx{font-size:22px;margin-top:14px}
.sv-logo{margin-top:22px;font-weight:800;font-size:18px;opacity:.6}
.sv-logo span{color:#2fd18b}
pre.report{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto}
/* MiTV 3 */
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:50%;width:38px;height:38px;font-size:17px;flex:none}
.iconbtn.listening{background:var(--err);border-color:var(--err);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.grid.rowg{grid-auto-flow:column;grid-auto-columns:var(--cardmin);grid-template-columns:none;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}
.grid.rowg.posters{grid-auto-columns:calc(var(--cardmin) * .85)}
.grid.rowg > *{scroll-snap-align:start}
.hero{display:flex;align-items:center;gap:18px;width:100%;text-align:left;background:linear-gradient(120deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin:6px 0 4px}
.hero:hover,.hero:focus-visible{border-color:var(--accent)}
.hero-img{width:120px;height:68px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--thumb1),var(--thumb2));border-radius:10px;padding:8px;flex:none}
.hero-img img{max-width:100%;max-height:100%}
.hero > div:not(.hero-img){flex:1;min-width:0}
.hero small{display:block;color:var(--accent);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.08em}
.hero b{display:block;font-size:20px}
.hero .muted{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appcard{align-items:flex-start;justify-content:flex-end;min-height:96px;padding:12px;color:#fff;border-color:transparent}
.appcard b{font-size:17px}
.appcard small{opacity:.8}
.matchcard{padding:10px 12px;gap:6px}
.matchcard .teams div,.match .mteams span{display:flex;align-items:center;gap:8px}
.matchcard .teams div span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14px}
.matchcard img,.match img{width:22px;height:22px;object-fit:contain}
.live{color:var(--err);font-weight:700}
.matches{display:flex;flex-direction:column;gap:8px}
.match{display:grid;grid-template-columns:120px 1fr 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.match .mteams{display:flex;flex-direction:column;gap:4px;font-weight:600}
.match .mt{font-size:13px}
.match .mtv{font-size:13px}
button.prog{text-align:left;color:inherit;font:inherit;cursor:pointer}
button.prog:hover,button.prog:focus-visible{border-color:var(--accent)}
#pYt{position:absolute;inset:0;display:none;background:#000}
#pYt iframe{width:100%;height:100%;border:0}
#pYt .ytopen{position:absolute;right:16px;bottom:16px}
#pAudio{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle at 50% 40%,#1a2338,#000);color:#fff;pointer-events:none}
#pAudio button{pointer-events:auto}
#pAudio .aart{width:220px;height:220px;border-radius:24px;background:#121826;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:80px}
#pAudio .aart img{width:100%;height:100%;object-fit:contain}

.matchcard img,.match img{width:28px;height:28px}
.live{display:inline-flex;align-items:center;gap:5px}
.matchcard.live .live,.match.live .live,.alive{animation:livePulse 1.6s ease-in-out infinite}
@keyframes livePulse{50%{opacity:.45}}
/* Pantalla de radio */
#pAudio{background:#05070d;overflow:hidden;gap:12px}
#pAudio .abg{position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 50% 38%,var(--tc,#1a2338),#05070d 72%)}
#pAudio .abg img{position:absolute;left:50%;top:40%;width:70%;height:70%;transform:translate(-50%,-50%);object-fit:contain;filter:blur(60px) saturate(1.6);opacity:.5}
#pAudio{isolation:isolate}
#pAudio .aart{position:relative;width:240px;height:240px;border-radius:28px;background:linear-gradient(145deg,var(--tc,#24304a),#0d1220);box-shadow:0 24px 60px #000a,0 0 0 1px #ffffff1a;display:grid;place-items:center;overflow:hidden}
#pAudio .aart .ini{font-size:72px;font-weight:900;color:#fff}
#pAudio .aart img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:22px;box-sizing:border-box;background:#0d1220}
#pAudio .alive{color:#ff5a5f;font-weight:800;font-size:12px;letter-spacing:.12em}
#pAudio b{font-size:28px;text-align:center;max-width:90%}
#pAudio small{text-transform:capitalize}
.eq{display:flex;align-items:flex-end;gap:4px;height:34px;margin:4px 0 6px}
.eq i{width:5px;height:6px;border-radius:3px;background:var(--accent);opacity:.85}
#pAudio.playing .eq i{animation:eqb 1s ease-in-out infinite}
.eq i:nth-child(3n){animation-delay:-.35s!important}.eq i:nth-child(3n+1){animation-delay:-.7s!important}.eq i:nth-child(4n){animation-duration:.8s!important}.eq i:nth-child(5n){animation-duration:1.25s!important}
@keyframes eqb{0%,100%{height:6px}50%{height:32px}}
#pAudio .arow{gap:10px;justify-content:center}
html.tv #pAudio .aart{width:300px;height:300px}
html.tv #pAudio .abg img,html.tv .hbg .hblur{display:none}
@media (prefers-reduced-motion:reduce){.hslide.hin>*,#pAudio.playing .eq i,.matchcard.live .live,.match.live .live,.alive{animation:none}}
/* MiTV 3.14: Continuar viendo */
.grid.editing .card{animation:wiggle .35s ease-in-out infinite alternate;border-color:#e5484d88}
.grid.editing .card::after{content:'✕';position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:#e5484d;color:#fff;font-weight:900;display:grid;place-items:center;box-shadow:0 4px 12px #0008;z-index:3}
@keyframes wiggle{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}
@media (prefers-reduced-motion:reduce){.grid.editing .card{animation:none}}
#rCont .grp{color:var(--accent);font-weight:600}

<script>
(() => {
'use strict';

/* =====================================================================
   Configuración
   ===================================================================== */
const CATALOG = 'https://iptv-org.github.io/iptv';
const CATALOG_MIRROR = 'https://raw.githubusercontent.com/iptv-org/iptv/gh-pages';
const COUNTRIES = [
  ['cr','Costa Rica','🇨🇷'],
  ['mx','México','🇲🇽'],['gt','Guatemala','🇬🇹'],['sv','El Salvador','🇸🇻'],['hn','Honduras','🇭🇳'],
  ['ni','Nicaragua','🇳🇮'],['pa','Panamá','🇵🇦'],['co','Colombia','🇨🇴'],['ve','Venezuela','🇻🇪'],
  ['ec','Ecuador','🇪🇨'],['pe','Perú','🇵🇪'],['bo','Bolivia','🇧🇴'],['cl','Chile','🇨🇱'],
  ['ar','Argentina','🇦🇷'],['uy','Uruguay','🇺🇾'],['py','Paraguay','🇵🇾'],['do','Rep. Dominicana','🇩🇴'],
  ['cu','Cuba','🇨🇺'],['pr','Puerto Rico','🇵🇷']
];
const CACHE_HOURS = 6, HEALTH_MIN = 30;
const CAT_ES = { Animation:'Animación', Auto:'Autos', Business:'Negocios', Classic:'Clásicos', Comedy:'Comedia', Cooking:'Cocina', Culture:'Cultura', Documentary:'Documentales', Education:'Educación', Entertainment:'Entretenimiento', Family:'Familia', General:'General', Kids:'Infantil', Legislative:'Legislativo', Lifestyle:'Estilo de vida', Movies:'Películas', Music:'Música', News:'Noticias', Outdoor:'Aire libre', Religious:'Religión', Science:'Ciencia', Series:'Series', Shop:'Compras', Sports:'Deportes', Travel:'Viajes', Weather:'Clima', Undefined:'Otros', Relax:'Relax', Public:'Público', Interactive:'Interactivo' };
const KIDS_CATS = ['kids','animation','family','education'];
const THEMES = [['','Oscuro'],['oled','Negro puro'],['medianoche','Medianoche'],['tica','Azul y rojo'],['oceano','Océano'],['atardecer','Atardecer'],['bosque','Bosque'],['claro','Claro']];
const COLORS = ['#2fd18b','#6c8cff','#e63946','#ffb547','#b86bff','#22b8cf'];
const AVATARS = ['🦊','🐼','🦁','🐯','🐸','🐧','🦄','🚀','⚽','🎸','🌈','🎬'];
const catName = c => CAT_ES[c] || c;
const android = window.MiTVAndroid || null;
// Modo TV: Fire TV, Android TV y televisores. Usa menos recursos y se maneja con el control.
const IS_TV = (() => { try { if (android && android.isTv) return !!android.isTv(); } catch(e){} return /AFT|Android TV|GoogleTV|BRAVIA|SmartTV|SMART-TV|Tizen|Web0S|HbbTV/i.test(navigator.userAgent); })();
const LITE = IS_TV || !!android;
if (IS_TV) document.documentElement.classList.add('tv');

/* =====================================================================
   Almacenamiento
   ===================================================================== */
let onStoreSet = null;
const store = {
  get(k, d){ try{ const v = localStorage.getItem('mitv:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('mitv:'+k, JSON.stringify(v)); onStoreSet && onStoreSet(k); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem('mitv:'+k); }catch(e){} },
  keys(){ try{ return Object.keys(localStorage).filter(k => k.startsWith('mitv:')).map(k => k.slice(5)); }catch(e){ return []; } }
};
const pstore = {
  get(k, d){ return store.get('P:'+S.pid+':'+k, d); },
  set(k, v){ return store.set('P:'+S.pid+':'+k, v); }
};

/* =====================================================================
   Estado
   ===================================================================== */
const S = {
  tab: 'inicio', q: '',
  reminders: store.get('reminders', []), recSched: store.get('recsched', []).filter(s => s.endAt > Date.now()), recHandles: {}, prevCtx: null,
  country: store.get('country','cr'),
  userList: null, sportsScope: 'es', moviesView: 'mine', jfSeries: null,
  profiles: store.get('profiles', null),
  pid: store.get('active', 'p1'),
  cfg: Object.assign({ pin:'', lockedCats:[], lockedUrls:[], epgUrls:[], tmdbKey:'', jf:null, quality:'auto', preview: !LITE && !matchMedia('(hover: none)').matches, health:true, onlyOk:false, resumeLast:true, ticker:true, yt:[], leagues:null }, store.get('cfg', {})),
  lists: store.get('lists', []),
  movies: [], cache: {}, current: null, visible: [],
  health: store.get('health', {}),
  epg: null, epgLoading: null,
  unlockedUntil: 0
};
if (!S.profiles){
  S.profiles = [{ id:'p1', name:'Principal', color:COLORS[0], kids:false }];
  store.set('profiles', S.profiles);
  // traer datos de la versión anterior
  ['favs','recents'].forEach(k => { const v = store.get(k, null); if (v){ store.set('P:p1:'+k, v); store.del(k); } });
}
if (!S.profiles.some(p => p.id === S.pid)) S.pid = S.profiles[0].id;
const P = {}; // datos del perfil activo
function loadProfile(){
  P.favs = pstore.get('favs', []); P.recents = pstore.get('recents', []);
  P.hidden = pstore.get('hidden', []); P.progress = pstore.get('progress', {});
  P.theme = pstore.get('theme', ''); P.big = pstore.get('big', false);
  P.multi = pstore.get('multi', { layout: 4, slots: [null,null,null,null], audio: 0 });
  P.stats = pstore.get('stats', { ch: {}, cat: {}, day: {} });
  P.lastLive = pstore.get('lastLive', null); P.prevLive = pstore.get('prevLive', null);
  P.pods = pstore.get('pods', []);
  document.documentElement.dataset.theme = P.theme;
  document.documentElement.classList.toggle('big', !!P.big);
  const pr = profile();
  const b = $('#profBtn'); b.textContent = pr.icon || pr.name[0].toUpperCase(); b.style.background = pr.color;
}
const profile = () => S.profiles.find(p => p.id === S.pid);
const saveCfg = () => store.set('cfg', S.cfg);
// La primera vez en un televisor: apagar la vista previa, que consume mucho
if (IS_TV && !store.get('tvInit', false)){ S.cfg.preview = false; store.set('tvInit', true); store.set('cfg', S.cfg); }

/* =====================================================================
   Utilidades
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const side = $('#side'), content = $('#content');
const sleep = ms => new Promise(r => setTimeout(r, ms));
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
const initials = n => (String(n).replace(/[^\p{L}\p{N} ]/gu,'').split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0]).join('') || '?').toUpperCase();
const fmtTime = d => d.toLocaleTimeString('es-CR', { hour:'numeric', minute:'2-digit' });
const fmtDur = s => { s = Math.floor(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h ? h+':'+String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); };
const cats = it => (it.group || '').split(';').map(s => s.trim().toLowerCase()).filter(Boolean);
const hasCat = (it, c) => cats(it).includes(c);
const isFav = url => P.favs.some(f => f.url === url);
const isVod = it => it.kind === 'vod' || it.kind === 'podcast' || it.local;
const noProbe = it => isVod(it) || it.kind === 'youtube' || it.kind === 'radio' || it.kind === 'series';
const itemKey = it => it.key || it.url;

/* =====================================================================
   Listas M3U
   ===================================================================== */
function cleanName(n){
  return n.replace(/\[Not 24\/7\]/i, '· horario limitado').replace(/\[Geo-blocked\]/i, '· solo en su país').trim();
}
function parseM3U(text, fallbackGroup){
  const out = [];
  let cur = null;
  const head = text.slice(0, 600).match(/^#EXTM3U[^\n]*/m);
  if (head){
    const m = head[0].match(/(?:x-tvg-url|url-tvg)="([^"]+)"/i);
    if (m) out.epg = m[1].split(',').map(s => s.trim()).filter(Boolean);
  }
  for (const raw of text.split(/\r?\n/)){
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith('#EXTINF')){
      const attrs = {};
      line.replace(/([\w-]+)="([^"]*)"/g, (_, k, v) => { attrs[k.toLowerCase()] = v; });
      const lq = line.lastIndexOf('"');
      const comma = line.indexOf(',', lq >= 0 ? lq : 0);
      const name = (comma >= 0 ? line.slice(comma + 1).trim() : '') || attrs['tvg-name'] || 'Sin nombre';
      cur = { name: cleanName(name), logo: attrs['tvg-logo'] || '', group: attrs['group-title'] || fallbackGroup || '', id: attrs['tvg-id'] || '' };
    } else if (line.startsWith('#')){
      // Algunos canales exigen que la petición diga de qué sitio viene (referrer) o qué programa la hace
      if (cur){
        let m;
        if ((m = line.match(/^#EXTVLCOPT:http-referr?er=(.+)$/i))) cur.ref = m[1].trim();
        else if ((m = line.match(/^#EXTVLCOPT:http-user-agent=(.+)$/i))) cur.ua = m[1].trim();
        else if ((m = line.match(/^#EXTHTTP:(\{.*\})$/i))){ try { const j = JSON.parse(m[1]); cur.ref = j.Referer || j.referer || cur.ref; cur.ua = j['User-Agent'] || j['user-agent'] || cur.ua; } catch(e){} }
      }
      continue;
    } else {
      const it = cur || { name: line.split('/').pop() || 'Canal', logo:'', group: fallbackGroup || '', id:'' };
      let url = line;
      // Formato de Kodi: enlace|Referer=…&User-Agent=…
      const pipe = url.indexOf('|');
      if (pipe > 0){
        new URLSearchParams(url.slice(pipe + 1)).forEach((v, k) => { if (/^referr?er$/i.test(k)) it.ref = v; if (/^user-agent$/i.test(k)) it.ua = v; });
        url = url.slice(0, pipe);
      }
      it.url = url;
      if ((it.ref || it.ua) && android && android.registerHeaders){ try { android.registerHeaders(new URL(url).host, it.ref || '', it.ua || ''); } catch(e){} }
      if (fallbackGroup && (/\.(mp4|mkv|avi|mov|m4v|webm)(\?|$)/i.test(line) || /movie|pel[ií]cul|vod|series/i.test(it.group))) it.kind = 'vod';
      out.push(it); cur = null;
    }
  }
  return out;
}
async function fetchText(url){
  const urls = [url];
  if (url.startsWith(CATALOG)) urls.push(url.replace(CATALOG, CATALOG_MIRROR));
  let lastErr;
  for (const u of urls){
    try {
      const res = await fetch(u, { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.text();
    } catch(e){ lastErr = e; }
  }
  throw lastErr;
}
async function loadRemote(url, group){
  if (S.cache[url]) return S.cache[url];
  const cached = store.get('c:'+url, null);
  if (cached){
    S.cache[url] = parseM3U(cached.v, group);
    if (Date.now() - cached.t > CACHE_HOURS*3600e3 && navigator.onLine !== false){
      fetchText(url).then(text => { store.set('c:'+url, { t: Date.now(), v: text }); S.cache[url] = parseM3U(text, group); }).catch(() => {});
    }
    return S.cache[url];
  }
  const text = await fetchText(url);
  store.set('c:'+url, { t: Date.now(), v: text });
  return (S.cache[url] = parseM3U(text, group));
}
function loadUserList(l){
  if (l.text) return Promise.resolve(S.cache['u:'+l.id] || (S.cache['u:'+l.id] = parseM3U(l.text, l.name)));
  return loadRemote(l.url, l.name);
}
const countryUrl = c => c === 'spa' ? `${CATALOG}/languages/spa.m3u` : `${CATALOG}/countries/${c}.m3u`;

/* =====================================================================
   Filtros: perfil infantil, ocultos, bloqueados, búsqueda, activos
   ===================================================================== */
function visibleItems(items){
  const q = S.q.trim().toLowerCase();
  const kids = profile().kids;
  return items.filter(it => {
    if (P.hidden.some(h => h.url === it.url)) return false;
    if (kids && !it.local && !it.jf && !cats(it).some(c => KIDS_CATS.includes(c))) return false;
    if (S.cfg.onlyOk && !isVod(it) && S.health[hk(it)] && S.health[hk(it)].ok === false) return false;
    if (q && !(it.name + ' ' + it.group).toLowerCase().includes(q)) return false;
    return true;
  });
}
const isLocked = it => S.cfg.pin && (S.cfg.lockedUrls.includes(it.url) || cats(it).some(c => S.cfg.lockedCats.includes(c)));

/* =====================================================================
   Ventanas (modales)
   ===================================================================== */
const modals = [];
function openModal(html, { onClose } = {}){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog">${html}</div>`;
  document.body.appendChild(bg);
  const m = { el: bg, prevFocus: document.activeElement, onClose };
  modals.push(m);
  bg.addEventListener('click', e => { if (e.target === bg) closeModal(); });
  setTimeout(() => (bg.querySelector('[autofocus]') || bg.querySelector('input,button'))?.focus(), 30);
  return bg.firstElementChild;
}
function closeModal(){
  const m = modals.pop(); if (!m) return false;
  m.el.remove(); m.onClose && m.onClose();
  if (m.prevFocus && document.contains(m.prevFocus)) m.prevFocus.focus();
  return true;
}
function askPin(title){
  return new Promise(resolve => {
    let done = false;
    const md = openModal(`<h3>${esc(title || 'Ingresa el PIN')}</h3>
      <div style="text-align:center"><input class="pin" id="pinIn" type="password" inputmode="numeric" maxlength="4" autocomplete="off" autofocus></div>
      <p class="muted" id="pinErr" style="text-align:center;min-height:20px"></p>
      <div class="actions"><button class="btn ghost" id="pinNo">Cancelar</button><button class="btn" id="pinOk">Aceptar</button></div>`,
      { onClose: () => { if (!done){ done = true; resolve(false); } } });
    const check = () => {
      if (md.querySelector('#pinIn').value === S.cfg.pin){ done = true; closeModal(); S.unlockedUntil = Date.now() + 10*60e3; resolve(true); }
      else { md.querySelector('#pinErr').textContent = 'PIN incorrecto'; md.querySelector('#pinIn').value = ''; }
    };
    md.querySelector('#pinOk').onclick = check;
    md.querySelector('#pinNo').onclick = () => closeModal();
    md.querySelector('#pinIn').addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
    md.querySelector('#pinIn').addEventListener('input', e => { if (e.target.value.length === 4) check(); });
  });
}
async function requirePin(title){
  if (!S.cfg.pin || Date.now() < S.unlockedUntil) return true;
  return askPin(title);
}

/* =====================================================================
   Guía de programación (XMLTV)
   ===================================================================== */
const normName = n => String(n).toLowerCase().replace(/\(.*?\)|\[.*?\]|·.*$/g, '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
function parseXmltvDate(s){
  const m = String(s).match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})?\s*([+-]\d{4})?/);
  if (!m) return 0;
  let t = Date.UTC(+m[1], +m[2]-1, +m[3], +m[4], +m[5], +(m[6]||0));
  if (m[7]){ const sg = m[7][0] === '-' ? -1 : 1; t -= sg * (+m[7].slice(1,3)*60 + +m[7].slice(3,5)) * 60e3; }
  return t;
}
const decodeXml = s => s.replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, '$1').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&').trim();
async function fetchMaybeGz(url){
  const res = await fetch(url, { cache: 'no-cache' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const buf = new Uint8Array(await res.arrayBuffer());
  if (buf[0] === 0x1f && buf[1] === 0x8b && 'DecompressionStream' in window){
    const ds = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(ds).text();
  }
  return new TextDecoder('utf-8').decode(buf);
}
function parseXmltv(text, into){
  const now = Date.now(), from = now - 3*3600e3, to = now + 26*3600e3;
  const chRe = /<channel\s+id="([^"]+)"[^>]*>([\s\S]*?)<\/channel>/g;
  let m;
  while ((m = chRe.exec(text))){
    const dn = m[2].match(/<display-name[^>]*>([\s\S]*?)<\/display-name>/g) || [];
    dn.forEach(d => { const n = normName(decodeXml(d.replace(/<[^>]+>/g, ''))); if (n && !into.names[n]) into.names[n] = m[1]; });
  }
  const pRe = /<programme\s+([^>]*)>([\s\S]*?)<\/programme>/g;
  while ((m = pRe.exec(text))){
    const a = {}; m[1].replace(/(\w+)="([^"]*)"/g, (_, k, v) => { a[k] = v; });
    const start = parseXmltvDate(a.start), stop = parseXmltvDate(a.stop);
    if (!start || stop < from || start > to) continue;
    const title = (m[2].match(/<title[^>]*>([\s\S]*?)<\/title>/) || [])[1];
    const desc = (m[2].match(/<desc[^>]*>([\s\S]*?)<\/desc>/) || [])[1];
    (into.progs[a.channel] = into.progs[a.channel] || []).push({ start, stop: stop || start + 3600e3, title: decodeXml(title || 'Sin título'), desc: desc ? decodeXml(desc) : '' });
  }
}
function epgSources(){
  const urls = new Set(S.cfg.epgUrls);
  Object.values(S.cache).forEach(list => (list.epg || []).forEach(u => urls.add(u)));
  return [...urls];
}
function loadEPG(force){
  if (S.epgLoading && !force) return S.epgLoading;
  const urls = epgSources();
  if (!urls.length){ S.epg = null; return Promise.resolve(null); }
  S.epgLoading = (async () => {
    const epg = { progs: {}, names: {}, errors: [] , urls };
    for (const u of urls){
      try { parseXmltv(await fetchMaybeGz(u), epg); }
      catch(e){ epg.errors.push(u + ' (' + e.message + ')'); }
    }
    Object.values(epg.progs).forEach(a => a.sort((x, y) => x.start - y.start));
    S.epg = epg;
    return epg;
  })();
  return S.epgLoading;
}
function epgFor(it){
  if (!S.epg) return null;
  const id = it.id || '';
  return S.epg.progs[id] || S.epg.progs[id.replace(/@.*$/, '')] || S.epg.progs[S.epg.names[normName(it.name)]] || null;
}
function nowNext(it){
  const list = epgFor(it); if (!list) return null;
  const t = Date.now();
  const i = list.findIndex(p => p.start <= t && p.stop > t);
  if (i < 0){ const n = list.find(p => p.start > t); return n ? { now: null, next: n } : null; }
  return { now: list[i], next: list[i+1] || null, rest: list.slice(i) };
}

/* =====================================================================
   Revisión de canales
   ===================================================================== */
let healthRun = 0;
/* Por qué un canal no se puede ver. 'ok' = funciona. Los motivos "app" solo afectan al navegador:
   en la app Android (o en VLC) esos canales sí se pueden ver. */
const WHY = {
  ok: 'Funciona',
  down: 'No responde: el enlace está caído o cambió',
  offline: 'Sin transmisión en este momento (canal con horario limitado)',
  html: 'El enlace ya no lleva a un video (el canal cambió su dirección)',
  denied: 'El servidor rechaza la conexión (bloqueo por país o enlace vencido)',
  segment: 'La lista responde pero el video no carga (bloqueo o enlace vencido)',
  cors: 'El navegador lo bloquea; funciona en la app Android o con VLC',
  mixed: 'Usa conexión no segura (http); funciona en la app Android o en el archivo MiTV.html',
  headers: 'Necesita datos especiales de conexión; funciona en la app Android o con VLC',
  timeout: 'Tarda demasiado en responder'
};
const APP_ONLY = ['cors', 'mixed', 'headers'];
const isHttpsPage = () => location.protocol === 'https:';
// Clave de la revisión de un canal: en el navegador, un canal que exige datos especiales
// (Referer/User-Agent) se guarda aparte, aunque comparta enlace con otro que sí funciona.
const hk = it => (!android && (it.ref || it.ua)) ? it.url + '|h' : it.url;
function browserBlock(it){
  if (android) return null;
  if (it.ref || it.ua) return 'headers';
  if (isHttpsPage() && /^http:/i.test(it.url)) return 'mixed';
  return null;
}
async function fetchT(url, opts, ms){
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), ms || 7000);
  try { return await fetch(url, Object.assign({ signal: ctl.signal, cache: 'no-store' }, opts || {})); }
  finally { clearTimeout(tm); setTimeout(() => ctl.abort(), 50); }
}
// deep = también revisa la lista de calidad y el primer pedazo de video (para el diagnóstico)
async function probe(it, deep){
  const r0 = await probeOne(it, it.url, deep);
  if (r0.why === 'ok' || !it.alts || !it.alts.length || APP_ONLY.includes(r0.why)) return r0;
  for (const alt of it.alts){
    const r = await probeOne(it, alt, deep);
    if (r.why === 'ok') return { why: 'ok', alt };
  }
  return r0;
}
async function probeOne(it0, url, deep){
  const it = Object.assign({}, it0, { url });
  const pre = browserBlock(it); if (pre) return { why: pre };
  let r;
  try { r = await fetchT(it.url, null, deep ? 10000 : 7000); }
  catch(e){
    if (e.name === 'AbortError') return { why: 'timeout' };
    try { await fetchT(it.url, { mode: 'no-cors' }, 6000); return { why: 'cors' }; } catch(e2){ return { why: 'down' }; }
  }
  if (r.status === 401 || r.status === 403) return { why: 'denied', code: r.status };
  if (r.status === 404 || r.status === 410) return { why: /horario limitado/.test(it.name) ? 'offline' : 'down', code: r.status };
  if (!r.ok) return { why: 'down', code: r.status };
  const isList = /m3u8/i.test(it.url) || /mpegurl/i.test(r.headers.get('content-type') || '');
  if (!isList) return { why: 'ok' };
  const text = (await r.text()).slice(0, 200000);
  if (!/#EXTM3U/.test(text)) return { why: /<html|<!doctype/i.test(text) ? 'html' : 'down' };
  if (!deep) return { why: 'ok' };
  // Lista principal → primera calidad → primer pedazo de video
  let base = r.url || it.url, pl = text;
  if (/#EXT-X-STREAM-INF/.test(pl)){
    const v = pl.split(/\r?\n/).find((l, i, a) => l && !l.startsWith('#') && /#EXT-X-STREAM-INF/.test(a[i - 1] || ''));
    if (!v) return { why: 'down' };
    const vu = new URL(v.trim(), base).href;
    let r2; try { r2 = await fetchT(vu, null, 8000); } catch(e){ return { why: 'segment' }; }
    if (r2.status === 401 || r2.status === 403) return { why: 'denied', code: r2.status };
    if (!r2.ok) return { why: 'segment', code: r2.status };
    pl = await r2.text(); base = r2.url || vu;
  }
  const seg = pl.split(/\r?\n/).find(l => l && !l.startsWith('#'));
  if (!seg) return { why: /#EXT-X-ENDLIST/.test(pl) ? 'down' : 'offline' };
  try {
    const r3 = await fetchT(new URL(seg.trim(), base).href, { headers: { Range: 'bytes=0-2047' } }, 8000);
    if (r3.status === 401 || r3.status === 403) return { why: 'denied', code: r3.status };
    if (!r3.ok && r3.status !== 206) return { why: 'segment', code: r3.status };
  } catch(e){ return { why: 'segment' }; }
  return { why: 'ok' };
}
const dotClass = h => !h ? '' : h.ok ? 'ok' : APP_ONLY.includes(h.why) ? 'warn' : 'down';
async function runHealth(list, grid){
  if (!S.cfg.health) return;
  const run = ++healthRun;
  const todo = list.map((it, i) => [it, i]).filter(([it]) => !noProbe(it) && !(S.health[hk(it)] && Date.now() - S.health[hk(it)].t < HEALTH_MIN*60e3)).slice(0, LITE ? 60 : 250);
  const status = content.querySelector('#hstat');
  let done = 0;
  const paint = (it, i) => { const d = grid.querySelector(`.card[data-i="${i}"] .dot`); if (d){ d.className = 'dot ' + dotClass(S.health[hk(it)]); d.title = WHY[S.health[hk(it)].why] || ''; } };
  const worker = async () => {
    while (todo.length && run === healthRun && !player.classList.contains('open')){
      const [it, i] = todo.shift();
      const res = await probe(it);
      S.health[hk(it)] = { ok: res.why === 'ok', why: res.why, code: res.code, alt: res.alt, t: Date.now() };
      done++; paint(it, i);
      if (status) status.textContent = `Revisando canales… ${done}`;
    }
  };
  if (todo.length && status) status.textContent = 'Revisando canales…';
  await Promise.all(Array.from({ length: LITE ? 2 : 6 }, worker));
  if (run !== healthRun) return;
  // Guardar solo lo reciente
  const cut = Date.now() - HEALTH_MIN*60e3;
  const keep = {}; Object.entries(S.health).forEach(([u, v]) => { if (v.t > cut) keep[u] = v; });
  S.health = keep; store.set('health', keep);
  if (status){
    const okN = list.filter(it => S.health[hk(it)]?.ok).length;
    const tot = list.filter(it => !noProbe(it)).length;
    status.textContent = tot ? `${okN} de ${tot} canales responden ahora` : '';
  }
}

   TMDB: portadas y sinopsis
   ===================================================================== */
function titleGuess(name){
  const y = (name.match(/\b(19[2-9]\d|20[0-4]\d)\b/) || [])[1];
  let t = name.replace(/\b(19[2-9]\d|20[0-4]\d)\b.*$/, '').replace(/\b(1080p|720p|480p|2160p|4k|bluray|brrip|webrip|web-dl|hdrip|dvdrip|x264|x265|hevc|latino|castellano|dual|subtitulado)\b.*$/i, '').replace(/[\[\(].*?[\]\)]/g, '').replace(/[-_.]+/g, ' ').trim();
  return { title: t || name, year: y };
}
async function tmdbLookup(it){
  if (!S.cfg.tmdbKey || it.poster) return;
  const g = titleGuess(it.name), ck = 't:' + (g.title + '|' + (g.year || '')).toLowerCase();
  let r = store.get(ck, null);
  if (!r){
    const key = S.cfg.tmdbKey.trim(), bearer = key.length > 40;
    const u = `https://api.themoviedb.org/3/search/movie?language=es-MX&include_adult=false&query=${encodeURIComponent(g.title)}${g.year ? '&year=' + g.year : ''}${bearer ? '' : '&api_key=' + encodeURIComponent(key)}`;
    try {
      const res = await fetch(u, bearer ? { headers: { Authorization: 'Bearer ' + key } } : {});
      if (res.status === 401) throw new Error('clave');
      const j = await res.json(); const m = (j.results || [])[0];
      r = m ? { title: m.title, year: (m.release_date || '').slice(0,4), poster: m.poster_path ? 'https://image.tmdb.org/t/p/w342' + m.poster_path : '', overview: m.overview, rating: m.vote_average } : { none: true };
      store.set(ck, r);
    } catch(e){ if (e.message === 'clave') toast('La clave de TMDB no es válida'); return; }
  }
  if (r && !r.none){ it.poster = r.poster; it.overview = r.overview; it.year = r.year; it.rating = r.rating; it.title = r.title; }
}

   Jellyfin
   ===================================================================== */
const devId = store.get('dev', null) || (() => { const d = 'mitv-' + Math.random().toString(36).slice(2, 10); store.set('dev', d); return d; })();
const jfAuthHeader = token => `MediaBrowser Client="MiTV", Device="MiTV", DeviceId="${devId}", Version="2.0"${token ? `, Token="${token}"` : ''}`;
async function jfLogin(server, user, pass){
  server = server.replace(/\/+$/, '');
  const res = await fetch(server + '/Users/AuthenticateByName', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Emby-Authorization': jfAuthHeader() },
    body: JSON.stringify({ Username: user, Pw: pass })
  });
  if (res.status === 401) throw new Error('usuario o contraseña incorrectos');
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const j = await res.json();
  return { server, token: j.AccessToken, userId: j.User.Id, user: j.User.Name };
}
async function jfGet(path){
  const jf = S.cfg.jf;
  const res = await fetch(jf.server + path + (path.includes('?') ? '&' : '?') + 'api_key=' + jf.token);
  if (res.status === 401){ throw new Error('la sesión de Jellyfin venció; vuelve a conectar en Ajustes'); }
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
function jfItem(x){
  const jf = S.cfg.jf;
  const cont = ((x.MediaSources || [])[0] || {}).Container || x.Container || '';
  const direct = /^(mp4|m4v|webm|mov)$/i.test(cont);
  const url = direct ? `${jf.server}/Videos/${x.Id}/stream?static=true&api_key=${jf.token}`
    : `${jf.server}/Videos/${x.Id}/master.m3u8?api_key=${jf.token}&MediaSourceId=${x.Id}&VideoCodec=h264&AudioCodec=aac,mp3&TranscodingMaxAudioChannels=2&SegmentContainer=ts&DeviceId=${devId}`;
  const ep = x.Type === 'Episode' ? `T${x.ParentIndexNumber ?? '?'} E${x.IndexNumber ?? '?'}` : '';
  return {
    name: x.Name, url, kind: x.Type === 'Series' ? 'series' : 'vod', jf: x.Id, key: 'jf:' + x.Id,
    poster: x.ImageTags && x.ImageTags.Primary ? `${jf.server}/Items/${x.Id}/Images/Primary?maxHeight=450&api_key=${jf.token}` : '',
    overview: x.Overview || '', year: x.ProductionYear || '', rating: x.CommunityRating || '',
    group: [ep, x.ProductionYear].filter(Boolean).join(' · ') || 'Jellyfin'
  };
}

function tileColor(name){
  let h = 7; const s = String(name || '?');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  return `hsl(${h} 42% 27%)`;
}
function skeletonHTML(n){
  return `<div class="sk-grid" aria-hidden="true">${'<div class="sk"><i></i><b></b></div>'.repeat(n || 12)}</div><span class="sr">Cargando…</span>`;
}
function thumbHTML(it, poster){
  const img = poster ? it.poster : it.logo;
  const ini = esc(initials(it.name));
  return img ? `<img loading="lazy" src="${esc(img)}" alt="" onerror="this.parentNode.insertAdjacentHTML('beforeend','<span class=ini>${ini}</span>');this.remove()">` : `<span class="ini">${ini}</span>`;
}
function cardsHTML(items, { numbers, poster }){
  return items.map((it, i) => {
    const nn = !isVod(it) && it.kind !== 'series' ? nowNext(it) : null;
    const pr = P.progress[itemKey(it)];
    const h = S.health[hk(it)];
    return `<button class="card" data-i="${i}">
      ${numbers ? `<span class="num">${i + 1}</span>` : ''}
      <span class="badges">${isLocked(it) ? '🔒' : ''}${isFav(it.url) ? '<span style="color:var(--warn)">★</span>' : ''}</span>
      <div class="thumb"${poster ? '' : ` style="--tc:${tileColor(it.name)}"`}>${thumbHTML(it, poster)}</div>
      ${pr && pr.d ? `<div class="pbar2"><i style="width:${Math.min(100, pr.t / pr.d * 100).toFixed(1)}%"></i></div>` : ''}
      <div class="meta"><div class="name">${esc(it.title || it.name)}</div>
        ${nn && nn.now ? `<div class="now">Ahora: ${esc(nn.now.title)}</div>` : `<div class="grp">${esc(it.year && poster ? it.year : (it.group || '').split(';').map(g => catName(g.trim())).join(' · ') || ' ')}</div>`}
      </div>
      ${!noProbe(it) && S.cfg.health ? `<span class="dot ${dotClass(h)}" title="${h ? esc(WHY[h.why] || '') : ''}"></span>` : ''}
    </button>`;
  }).join('');
}

// Muestra una cuadrícula. live=true activa números, revisión de canales y vista previa.
function renderGrid(target, items, emptyMsg, opts = {}){
  const list = visibleItems(items);
  const live = opts.live !== false && !opts.poster;
  if (live) S.visible = list;
  const head = live && S.cfg.health ? `<div class="toolbar"><button class="chip ${S.cfg.onlyOk ? 'active' : ''}" data-act="onlyok">Solo canales activos</button><button class="chip" data-act="diag">🩺 Diagnóstico</button><span class="muted" id="hstat" style="font-size:13px"></span></div>` : '';
  if (!list.length){ target.innerHTML = head + `<div class="empty">${profile().kids && items.length ? 'No hay contenido infantil aquí.' : (emptyMsg || 'No hay resultados.')}</div>`; bindHead(target); return; }
  const STEP = IS_TV ? 120 : 600, MAX = target._max || STEP;
  target.innerHTML = head + `<div class="grid ${opts.poster ? 'posters' : ''} ${opts.row ? 'rowg' : ''}">${cardsHTML(list.slice(0, MAX), { numbers: live, poster: opts.poster })}</div>` +
    (list.length > MAX ? `<div style="margin-top:14px"><button class="btn ghost" data-act="more">Mostrar más (quedan ${list.length - MAX})</button></div>` : '');
  const more = target.querySelector('[data-act=more]');
  if (more) more.onclick = () => { target._max = MAX + STEP; renderGrid(target, items, emptyMsg, opts); tvRefocus(target.querySelectorAll('.card')[MAX]); };
  const grid = target.querySelector('.grid');
  grid._items = list;
  grid.addEventListener('click', e => {
    const c = e.target.closest('.card'); if (!c) return;
    const it = list[+c.dataset.i];
    if (opts.onOpen) return opts.onOpen(it, +c.dataset.i, list);
    if (isVod(it)) openDetail(list, +c.dataset.i); else play(list, +c.dataset.i);
  });
  bindHead(target);
  if (live) runHealth(list.slice(0, MAX), grid);
  tvRefocus();
}
function bindHead(target){
  const b = target.querySelector('[data-act=onlyok]');
  if (b) b.onclick = () => { S.cfg.onlyOk = !S.cfg.onlyOk; saveCfg(); render(); };
  const d = target.querySelector('[data-act=diag]');
  if (d) d.onclick = () => runDiagnosis(S.visible);
}
async function withLoading(target, fn){
  target.innerHTML = '<div class="loading skel">' + skeletonHTML(IS_TV ? 12 : 18) + '</div>';
  try { await fn(); tvRefocus(); }
  catch(err){
    logEvent('carga', err.message);

    const ul = S.tab === 'vivo' && S.userList && S.lists.find(l => l.id === S.userList && l.url);
    if (ul){
      const info = listErrInfo(ul.url, err);
      target.innerHTML = `<div class="empty"><b style="color:var(--text)">No se pudo abrir la lista “${esc(ul.name)}”.</b><br><br>${esc(info.t)}${info.web ? '<br><br>En la app Android esta lista sí se puede abrir. En el navegador puedes descargarla y subirla como archivo en Ajustes → Mis listas IPTV.' : ''}
        <div style="margin-top:12px" class="row"><button class="btn ghost" id="retry">Reintentar</button>${info.web ? `<a class="btn ghost" href="${esc(ul.url)}" target="_blank" rel="noopener">⬇️ Descargar la lista</a><button class="btn ghost" id="upL">📁 Subir archivo .m3u</button>` : ''}</div></div>`;
      const rr = target.querySelector('#retry'); if (rr) rr.onclick = () => render();
      const up = target.querySelector('#upL'); if (up) up.onclick = () => $('#fileM3u').click();
      return;
    }
    target.innerHTML = `<div class="empty"><b style="color:var(--text)">No se pudo cargar</b> (${esc(err.message)}).<br><br>
      • Revisa tu conexión a internet.<br>
      • Si estás viendo la app dentro de la vista previa del chat, esa vista bloquea internet: descarga el archivo MiTV.html y ábrelo con Chrome o Edge.<br>
      • Si usas un bloqueador de anuncios o antivirus con filtro web, prueba desactivarlo para este archivo.
      <div style="margin-top:12px"><button class="btn ghost" id="retry">Reintentar</button></div></div>`;
    const r = target.querySelector('#retry'); if (r) r.onclick = () => render();
  }
}

/* Vista previa al enfocar una tarjeta */
let pvTimer = null, pv = null;
function stopPreview(){
  clearTimeout(pvTimer);
  if (pv){ pv.hls && pv.hls.destroy(); pv.video.remove(); pv = null; }
}
function schedulePreview(card){
  if (!S.cfg.preview || player.classList.contains('open')) return;
  const grid = card.closest('.grid'); if (!grid || !grid._items) return;
  const it = grid._items[+card.dataset.i];
  if (!it || noProbe(it) || isLocked(it)) return;
  if (pv && pv.card === card) return;
  stopPreview();
  pvTimer = setTimeout(() => {
    const v = document.createElement('video');
    v.className = 'prev'; v.muted = true; v.autoplay = true; v.playsInline = true;
    card.querySelector('.thumb').appendChild(v);
    pv = { card, video: v, hls: null };
    if (/m3u8/i.test(it.url) && window.Hls && Hls.isSupported()){
      pv.hls = new Hls({ maxBufferLength: 6, capLevelToPlayerSize: true, startLevel: 0 });
      pv.hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) stopPreview(); });
      pv.hls.loadSource(it.url); pv.hls.attachMedia(v);
    } else v.src = it.url;
    v.play().catch(() => {});
  }, 1200);
}
content.addEventListener('focusin', e => { const c = e.target.closest('.card'); if (c) schedulePreview(c); });
content.addEventListener('mouseover', e => { const c = e.target.closest('.card'); if (c) schedulePreview(c); });
content.addEventListener('mouseleave', stopPreview);
content.addEventListener('focusout', e => { if (pv && !pv.card.contains(e.relatedTarget)) stopPreview(); });

// En TV, si el foco se pierde (porque se redibujó la pantalla), ponerlo en un lugar lógico
let focusHint = null;
function tvRefocus(pref){
  if (!IS_TV) return;
  setTimeout(() => {
    if (modals.length || player.classList.contains('open')) return;
    const a = document.activeElement;
    if (pref && document.contains(pref)){ pref.focus({ preventScroll: false }); return; }
    if (a && a !== document.body && document.contains(a)) return;
    const el = (focusHint === 'side' && side.style.display !== 'none' && side.querySelector('.active')) || content.querySelector('.card, .hero, .match button, .prog, .guide-ch') || content.querySelector('button, input') || $('#tabs .active');
    if (el) el.focus({ preventScroll: true });
  }, 30);
}
function sideButton(label, active, attrs, icon){
  return `<button ${attrs} class="${active ? 'active' : ''}">${icon ? `<span class="flag">${icon}</span>` : ''}${esc(label)}</button>`;
}
function render(){
  focusHint = side.contains(document.activeElement) ? 'side' : $('#tabs').contains(document.activeElement) ? 'tabs' : 'content';
  stopPreview(); healthRun++;
  if (S.tab !== 'multi') destroyMulti();
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === S.tab));
  if (focusHint === 'tabs' && IS_TV) setTimeout(() => $('#tabs .active')?.focus({ preventScroll: true }), 30); else tvRefocus();
  $('#bgArt').classList.toggle('show', S.tab === 'inicio' && !!(P.lastLive && P.lastLive.logo));
  ({ plus: viewPlus, inicio: viewInicio, radio: viewRadio, vivo: viewVivo, guia: viewGuia, deportes: viewDeportes, peliculas: viewPeliculas, multi: viewMulti, favoritos: viewFavoritos, ajustes: viewAjustes })[S.tab]();
}

let enrichRun = 0;
async function enrichMovies(items){
  if (!S.cfg.tmdbKey) return;
  const run = ++enrichRun, view = S.moviesView;
  const todo = items.filter(i => !i.poster && !i.jf && !i.tmdbDone).slice(0, 120);
  if (!todo.length) return;
  let found = 0;
  for (const it of todo){ if (run !== enrichRun) return; await tmdbLookup(it); it.tmdbDone = true; if (it.poster) found++; }
  if (found && S.tab === 'peliculas' && S.moviesView === view && run === enrichRun && !modals.length) render();
}

const mvPlayers = [];
function destroyMulti(){ while (mvPlayers.length){ const p = mvPlayers.pop(); p && p.hls && p.hls.destroy(); p && p.video && (p.video.removeAttribute('src'), p.video.load()); } }
function viewMulti(){
  side.style.display = 'none';
  destroyMulti();
  const M = P.multi, n = M.layout;
  content.innerHTML = `<h2>Multivista</h2><p class="sub">Mira varios canales a la vez. Toca un recuadro para escuchar su audio.</p>
    <div class="toolbar">
      <button class="chip ${n === 2 ? 'active' : ''}" data-l="2">2 pantallas</button>
      <button class="chip ${n === 4 ? 'active' : ''}" data-l="4">4 pantallas</button>
      <button class="btn ghost small" id="mvFull">⛶ Pantalla completa</button>
    </div>
    <div class="mv l${n}" id="mv">${Array.from({ length: n }, (_, i) => `
      <div class="slot ${M.audio === i ? 'audio' : ''}" data-s="${i}">
        ${M.slots[i] ? `<video muted playsinline autoplay></video><button class="sel" data-sel="${i}" tabindex="-1" aria-hidden="true"></button>` : '<span class="empty-slot">Vacío</span>'}
        <div class="lbl">${M.slots[i] ? `<span>${M.audio === i ? '🔊 ' : ''}${esc(M.slots[i].name)}</span><button class="btn ghost small" data-sel="${i}">${M.audio === i ? '🔊 Sonando' : '🔈 Escuchar'}</button>` : ''}<button class="btn small" data-pick="${i}">${M.slots[i] ? 'Cambiar' : '+ Elegir canal'}</button></div>
      </div>`).join('')}</div>`;
  content.querySelector('.toolbar').onclick = e => {
    const b = e.target.closest('[data-l]'); if (!b) return;
    M.layout = +b.dataset.l; if (M.audio >= M.layout) M.audio = 0; pstore.set('multi', M); render();
  };
  $('#mvFull').onclick = () => { const el = $('#mv'); (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el)?.catch?.(() => {}); };
  $('#mv').onclick = e => {
    const p = e.target.closest('[data-pick]'); if (p) return pickChannel(+p.dataset.pick);
    const s = e.target.closest('[data-sel]'); if (s){ M.audio = +s.dataset.sel; pstore.set('multi', M); applyAudio(); }
  };
  for (let i = 0; i < n; i++){
    const it = M.slots[i]; if (!it){ mvPlayers.push(null); continue; }
    const v = content.querySelector(`.slot[data-s="${i}"] video`);
    const p = { video: v, hls: null };
    if (/m3u8/i.test(it.url) && window.Hls && Hls.isSupported()){
      p.hls = new Hls({ capLevelToPlayerSize: true, maxBufferLength: 10 });
      p.hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal){ const r = d.type === Hls.ErrorTypes.NETWORK_ERROR; r ? setTimeout(() => p.hls && p.hls.startLoad(), 3000) : p.hls.recoverMediaError(); } });
      p.hls.loadSource(it.url); p.hls.attachMedia(v);
    } else v.src = it.url;
    mvPlayers.push(p);
  }
  applyAudio();
}
function applyAudio(){
  const M = P.multi;
  mvPlayers.forEach((p, i) => { if (p){ p.video.muted = i !== M.audio; p.video.play().catch(() => {}); } });
  content.querySelectorAll('.slot').forEach((s, i) => {
    s.classList.toggle('audio', i === M.audio);
    const sp = s.querySelector('.lbl span'); if (sp && M.slots[i]) sp.textContent = (i === M.audio ? '🔊 ' : '') + M.slots[i].name;
    const lb = s.querySelector('.lbl [data-sel]'); if (lb) lb.textContent = i === M.audio ? '🔊 Sonando' : '🔈 Escuchar';
  });
}
function pickChannel(slot){
  const sources = [['fav','Favoritos'],['rec','Recientes'],['cr','Costa Rica'],['dep','Deportes'],['spa','En español'], ...S.lists.map(l => [l.id, l.name])];
  let src = P.favs.length ? 'fav' : 'cr', items = [];
  const md = openModal(`<h3>Elegir canal para el recuadro ${slot + 1}</h3>
    <div class="toolbar" id="pkSrc"></div>
    <input id="pkQ" type="search" placeholder="Buscar…" style="width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);margin-bottom:10px">
    <div id="pkList" style="max-height:50vh;overflow:auto"></div>
    <div class="actions">${P.multi.slots[slot] ? '<button class="btn danger" id="pkClear">Vaciar recuadro</button>' : ''}<button class="btn ghost" id="pkNo">Cerrar</button></div>`);
  const drawSrc = () => { md.querySelector('#pkSrc').innerHTML = sources.map(([k, n]) => `<button class="chip ${k === src ? 'active' : ''}" data-k="${esc(k)}">${esc(n)}</button>`).join(''); };
  const drawList = () => {
    const q = md.querySelector('#pkQ').value.toLowerCase();
    const l = visibleItems(items).filter(i => !isVod(i) && (!q || i.name.toLowerCase().includes(q))).slice(0, 150);
    md.querySelector('#pkList').innerHTML = l.length ? l.map((it, i) => `<div class="list-item"><div class="grow"><b>${esc(it.name)}</b><small>${esc((it.group || '').split(';').map(g => catName(g.trim())).join(' · '))}</small></div><button class="btn small" data-i="${i}">Elegir</button></div>`).join('') : '<p class="muted">Sin canales.</p>';
    md.querySelector('#pkList')._l = l;
  };
  const load = async () => {
    md.querySelector('#pkList').innerHTML = '<p class="muted">Cargando…</p>';
    try {
      if (src === 'fav') items = P.favs;
      else if (src === 'rec') items = P.recents;
      else if (src === 'cr') items = await loadRemote(countryUrl('cr'));
      else if (src === 'spa') items = await loadRemote(countryUrl('spa'));
      else if (src === 'dep') items = (await loadRemote(countryUrl('spa'))).filter(i => hasCat(i, 'sports'));
      else { const l = S.lists.find(x => x.id === src); items = l ? await loadUserList(l) : []; }
    } catch(e){ items = []; }
    drawList();
  };
  md.querySelector('#pkSrc').onclick = e => { const b = e.target.closest('[data-k]'); if (!b) return; src = b.dataset.k; drawSrc(); load(); };
  md.querySelector('#pkQ').oninput = drawList;
  md.querySelector('#pkList').onclick = async e => {
    const b = e.target.closest('[data-i]'); if (!b) return;
    const it = md.querySelector('#pkList')._l[+b.dataset.i];
    if (isLocked(it) && !(await requirePin('Canal bloqueado'))) return;
    P.multi.slots[slot] = { name: it.name, url: it.url, logo: it.logo, group: it.group, id: it.id };
    pstore.set('multi', P.multi); closeModal(); render();

/* ---------- Copia de seguridad ---------- */
async function gz(str, inflate){
  const stream = new Blob([str]).stream().pipeThrough(inflate ? new DecompressionStream('gzip') : new CompressionStream('gzip'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
async function exportCode(){
  const data = { v: 2, profiles: S.profiles, active: S.pid, lists: S.lists, country: S.country,
    cfg: Object.assign({}, S.cfg, { jf: S.cfg.jf ? { server: S.cfg.jf.server, user: S.cfg.jf.user } : null, cloud: null }), per: {} };
  store.keys().filter(k => k.startsWith('P:')).forEach(k => { data.per[k] = store.get(k); });
  let code;
  try { code = 'MITV2:' + b64(await gz(JSON.stringify(data))); }
  catch(e){ code = 'MITV2J:' + btoa(unescape(encodeURIComponent(JSON.stringify(data)))); }
  const md = openModal(`<h3>Tu código</h3><p class="muted">Cópialo y pégalo en <b>Ajustes → Pegar código</b> en el otro dispositivo. No incluye la contraseña de Jellyfin.</p>
    <textarea id="code" readonly style="width:100%;height:160px;font-size:12px">${esc(code)}</textarea>
    <div class="actions"><button class="btn ghost" id="cNo">Cerrar</button><button class="btn" id="cCopy" autofocus>Copiar</button></div>`);
  md.querySelector('#cNo').onclick = () => closeModal();
  md.querySelector('#cCopy').onclick = async () => {
    try { await navigator.clipboard.writeText(code); toast('Código copiado'); }
    catch(e){ md.querySelector('#code').select(); toast('Selecciónalo y cópialo manualmente'); }
  };
}
function importCode(){
  const md = openModal(`<h3>Pegar código</h3><p class="muted">Esto reemplaza los perfiles, favoritos, listas y ajustes de este dispositivo.</p>
    <textarea id="code" style="width:100%;height:160px;font-size:12px" autofocus></textarea>
    <div class="actions"><button class="btn ghost" id="cNo">Cancelar</button><button class="btn" id="cOk">Importar</button></div>`);
  md.querySelector('#cNo').onclick = () => closeModal();
  md.querySelector('#cOk').onclick = async () => {
    const code = md.querySelector('#code').value.trim();
    try {
      let json;
      if (code.startsWith('MITV2:')){ const bin = atob(code.slice(6)); const u8 = Uint8Array.from(bin, c => c.charCodeAt(0)); json = new TextDecoder().decode(await gz(u8, true)); }
      else if (code.startsWith('MITV2J:')) json = decodeURIComponent(escape(atob(code.slice(7))));
      else throw new Error('formato');
      const d = JSON.parse(json);
      store.keys().filter(k => k.startsWith('P:')).forEach(k => store.del(k));
      Object.entries(d.per || {}).forEach(([k, v]) => store.set(k, v));
      store.set('profiles', d.profiles); store.set('active', d.active); store.set('lists', d.lists || []); store.set('country', d.country || 'cr');
      const cfg = d.cfg || {}; if (cfg.jf) cfg.jf = null; store.set('cfg', cfg);
      toast('Importado. Recargando…'); setTimeout(() => location.reload(), 800);
    } catch(e){ toast('El código no es válido'); }
  };
}

function addMovieFiles(files){
  const vids = [...files].filter(f => f.type.startsWith('video/') || /\.(mp4|mkv|avi|mov|m4v|webm|ts)$/i.test(f.name));
  for (const f of vids){
    const key = 'f:' + f.name + '|' + f.size;
    if (S.movies.some(m => m.key === key)) continue;
    const folder = (f.webkitRelativePath || '').split('/').slice(-2, -1)[0] || '';
    S.movies.push({ name: f.name.replace(/\.[^.]+$/, '').replace(/[._]+/g, ' '), url: URL.createObjectURL(f), size: f.size, key, kind: 'vod', local: true,
      group: folder || (f.size >= 1e9 ? (f.size/1e9).toFixed(1) + ' GB' : Math.max(1, Math.round(f.size/1e6)) + ' MB') });
  }
  S.movies.sort((a, b) => a.name.localeCompare(b.name, 'es'));
  toast(vids.length ? `${vids.length} película(s) agregada(s)` : 'No se encontraron archivos de video');
  if (S.tab === 'peliculas') render();
}
$('#fileMovies').onchange = e => { S.moviesView = 'mine'; addMovieFiles(e.target.files); e.target.value = ''; };

  render();
};

function startSource(it){

  if (it.kind === 'youtube'){ showYouTube(it); android && android.setPlaying && android.setPlaying(true); return; }

  const isHls = /\.m3u8(\?|$)/i.test(url) || /m3u8|\/hls\//i.test(url);

function reconnect(){
